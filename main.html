","{0}개":"{0}","마운팅 미상 — 고주파 대역의 유효성을 판단할 수 없어 상한 없이 전 대역을 그대로 씁니다(커토그램 탐색·대역 근거).":"Mounting unknown — the validity of high-frequency bands can't be judged, so all bands are used without an upper limit (kurtogram search · band evidence).","유효 상한 {0} kHz — 그 위 대역은 마운팅 공진일 수 있어 결함 대역 탐색에서 제외됩니다.{1}":"Effective upper limit {0} kHz — bands above it may be mounting resonance and are excluded from the fault band search.{1}"," 현재 선택 대역 {0} kHz는 상한을 넘어 재선택됩니다.":" The currently selected band {0} kHz exceeds the limit and will be reselected.","회전주파수 — 축이 1초에 도는 횟수(RPM÷60)입니다. 불평형 등 대부분의 기계 결함이 이 값의 정수배에서 나타나 모든 해석의 기준이 됩니다.":"Rotation frequency — the number of shaft revolutions per second (RPM÷60). Most mechanical faults, such as unbalance, appear at integer multiples of this value, making it the reference for all analysis.","회전주파수의 2배 성분입니다. 이 성분이 크면 정렬불량을 의심합니다.":"The component at twice the rotation frequency. If it is large, suspect misalignment.","외륜 결함 주파수(Ball Pass Frequency, Outer)입니다. 전동체가 외륜의 흠집을 지날 때마다 충격이 나는 빈도로, 포락선 스펙트럼에서 이 주파수와 그 배수가 보이면 외륜 손상 신호입니다.":"Outer race defect frequency (Ball Pass Frequency, Outer). The rate of impacts as rolling elements pass a defect on the outer race; if this frequency and its multiples appear in the envelope spectrum, it signals outer race damage.","내륜 결함 주파수(Ball Pass Frequency, Inner)입니다. 내륜은 축과 함께 돌기 때문에, 이 주파수 양옆에 회전주파수 간격의 측대역을 동반하는 것이 특징입니다.":"Inner race defect frequency (Ball Pass Frequency, Inner). Because the inner race rotates with the shaft, it is characteristically accompanied by sidebands spaced at the rotation frequency on both sides.","전동체(볼) 결함 주파수(Ball Spin Frequency)입니다. 볼 표면의 흠집이 궤도면에 닿는 빈도로, 볼 자체 손상 시 나타납니다.":"Rolling element (ball) defect frequency (Ball Spin Frequency). The rate at which a defect on a ball's surface contacts the raceway; it appears when the ball itself is damaged.","케이지(리테이너) 회전 주파수(Fundamental Train Frequency)입니다. 보통 회전주파수의 0.35~0.45배이며, 케이지 손상·윤활 불량 시 이 성분이 나타납니다.":"Cage (retainer) rotation frequency (Fundamental Train Frequency). Usually 0.35~0.45× the rotation frequency; this component appears with cage damage or poor lubrication.","— 선택 —":"— Select —","I · 소형":"I · small","II · 중형":"II · medium","III · 대형·강성":"III · large·rigid","IV · 대형·연성":"IV · large·flexible",닫기:"Close",설정:"Settings","{0} (직접)":"{0} (custom)","{0}은(는) 제조사·설계(E·CC·CA 등)마다 롤러 수가 달라 목록에서 뺐습니다 — 옛 목록 값을 넣어 두었으니 제조사 카탈로그 값으로 확인하세요":"{0} was removed from the list because its roller count differs by manufacturer and design (E·CC·CA, etc.) — the old list values were filled in, so verify them against the manufacturer's catalog","— 미상 —":"— Unknown —","스터드(나사)":"Stud (screw)",접착:"Adhesive",자석:"Magnet",핸드프로브:"Hand probe",직결:"Direct","벨트·풀리":"Belt·pulley",기어:"Gear","풀리경 또는 종동축 회전수가 있어야 결함 패턴을 잴 수 있습니다":"Pulley diameters or the driven-shaft speed are needed to measure the fault pattern","결함 대조 회전수 {0} rpm (종동축 · {1})":"Fault-matching speed {0} rpm (driven shaft · {1})","종동축 1× {0} Hz (비 {1})":"Driven shaft 1× {0} Hz (ratio {1})",종동:"Driven","종동측 센서 — 풀리경이나 종동축 회전수가 없어 결함 패턴을 잴 수 없습니다":"Driven-side sensor — the fault pattern can't be measured without pulley diameters or the driven-shaft speed","종동축 {0} rpm으로 대조 ({1})":"Matched at driven shaft {0} rpm ({1})","풀리비 {0} 환산":"pulley ratio {0}","{0} (풀리 환산)":"{0} (pulley-derived)","모르면 비워 두세요":"Leave blank if unknown","베인 통과 {0} Hz":"Vane pass {0} Hz","판정 불가":"Cannot assess",'회전수와 베어링 기하가 둘 다 있어야 결함주파수 격자를 세울 수 있습니다. 하나라도 없으면 등급을 켜는 축이 비어 카드가 "판정 보류"로 남습니다(미끄럼 베어링도 구름체가 없어 여기 포함됩니다). 좌측 "판정 불가" 배지와 같은 기준·같은 수입니다.':'Both speed and bearing geometry are needed to build the defect frequency grid. If either is missing, the axis that turns on the grade is empty and the card stays at "assessment on hold" (sleeve bearings are included here too, since they have no rolling elements). Same criteria and same count as the "Cannot assess" badge on the left.',"같은 설비 {0}*":"Same equipment {0}*","같은 테이블 {0}":"Same table {0}","목록 전체":"Entire list","지금 걸러진 목록":"Current filtered list",스터드:"Stud",베어링:"Bearing",구동:"Drive",종동측:"Driven side",모터측:"Motor side","풀리 D1":"Pulley D1","풀리 D2":"Pulley D2","종동축 회전수":"Driven-shaft speed",개:"",매:"","{0} · {1}개":"{0} · {1}","태그 {0}개에 적용":"Apply to {0} tags","대상 태그의 해당 항목을 덮어씁니다. 끈 항목과 이 행에 값이 없는 항목은 건드리지 않습니다.":"Overwrites these fields on the target tags. Fields switched off and fields empty in this row are left untouched.","브라우저 시간{0}":"Browser time{0}","지금 {0}{1}":"Now {0}{1}"," · 저장하면 적용됩니다":" · applies after saving","센서가 저장하는 물리량입니다. mm/s는 속도, g는 가속도, μm는 변위이며, 데이터를 넣을 때 이미 정해진 값이라 모르면 계측 담당자에게 확인하세요. 등급의 높이는 속도(mm/s) 기준 ISO 10816 존으로 정하며, 가속도·변위 센서도 값을 속도로 환산해 판정하므로 단위가 틀리면 등급 높이가 틀어집니다.":"The physical quantity the sensor stores. mm/s is velocity, g is acceleration and μm is displacement; it is fixed when the data is ingested, so if unsure, ask whoever handles the measurements. The grade level is set by ISO 10816 zones based on velocity (mm/s), and acceleration/displacement sensors are also converted to velocity for assessment, so a wrong unit skews the grade level.","ISO 10816 기계 등급으로, 기계의 출력과 기초 강성에 따라 정합니다. I은 소형(15 kW 이하), II는 중형(15~75 kW), III·IV는 대형(각각 강성·연성 기초)입니다. 같은 진동값이라도 등급에 따라 양호/위험 판정이 달라집니다. 비워두면 Class II 기준(1.12 / 2.80 / 7.10 mm/s)으로 판정합니다.":"ISO 10816 machine class, set by the machine's power and foundation stiffness. I is small (up to 15 kW), II is medium (15~75 kW), and III·IV are large (rigid and flexible foundations respectively). The same vibration value can be assessed as Good or Danger depending on the class. If left blank, Class II criteria (1.12 / 2.80 / 7.10 mm/s) are used.","이 계측점 베어링이 달린 축의 실제 운전 회전수입니다. 명판의 정격 회전수(예: 1750)를 넣고 동기속도(1800)는 넣지 마십시오. 결함 패턴은 이 값으로 결함 주파수를 계산해 허용오차 1%로 대조하므로, 1% 넘게 틀리면 결함을 놓칩니다. 스펙트럼에서 잰 실측 회전수는 차수 라벨·스펙트럼 해석에 쓰고, 입력값과 2% 넘게 다르면 상세분석에서 알려 드립니다. 자릿수는 반드시 맞아야 합니다 — 3600 rpm 설비에 1800을 넣으면 모든 주파수 해석과 대역 경계가 절반으로 어긋납니다. 비워 두면 회전수 미상으로 처리해 결함 패턴 판정과 대역 추출이 멈추고 등급이 서지 않습니다.\n\n· 감속기(기어) 출력축의 센서면 그 축의 회전수(모터 회전수 ÷ 감속비)를 넣으십시오.\n· 벨트 구동이면 모터의 정격 회전수를 넣고, 센서가 벨트 반대편(팬·펌프 등)이면 설비 설정의 센서 위치를 종동측으로 고르십시오 — 풀리비로 환산합니다.":`The actual operating speed of the shaft carrying this measurement point's bearing. Enter the nameplate rated speed (e.g. 1750), not the synchronous speed (1800). The fault pattern computes defect frequencies from this value and matches them within 1% tolerance, so an error of more than 1% means faults are missed. The speed measured from the spectrum is used for order labels and spectrum interpretation, and Detailed analysis alerts you if it differs from the entered value by more than 2%. The order of magnitude must be right — entering 1800 for 3600 rpm equipment shifts all frequency analysis and band boundaries by half. If left blank, the speed is treated as unknown: fault pattern assessment and band extraction stop and no grade is given.

· For a sensor on a reducer (gear) output shaft, enter that shaft's speed (motor speed ÷ reduction ratio).
· For a belt drive, enter the motor's rated speed; if the sensor is on the far side of the belt (fan, pump, etc.), set the sensor position in equipment settings to driven side — it is converted using the pulley ratio.`,"설치된 구름베어링의 품번입니다. 베어링 외륜의 각인이나 정비 이력에서 확인할 수 있습니다. 품번을 고르면 결함 주파수(BPFO/BPFI/BSF/FTF)가 자동 계산되어 베어링 결함을 판정할 수 있게 됩니다. 저널(유막) 베어링이면 sleeve를, 목록에 없는 품번이면 직접 입력을 고르세요. 비워두면 베어링 결함은 판정하지 않습니다.":"Part number of the installed rolling-element bearing, found on the marking on the bearing's outer race or in maintenance records. Choosing a part number automatically computes the defect frequencies (BPFO/BPFI/BSF/FTF) so bearing faults can be assessed. For a journal (oil-film) bearing choose sleeve; for a part number not in the list choose manual entry. If left blank, bearing faults are not assessed.","센서를 기계에 붙인 방법입니다. 나사로 고정했으면 스터드, 본드로 붙였으면 접착, 자석이면 자석, 손으로 대고 재면 핸드프로브를 고르세요. 방식에 따라 믿을 수 있는 주파수 상한이 달라서(스터드 10, 접착 5, 자석 2, 프로브 1 kHz) 그보다 높은 대역은 기계가 아니라 마운팅이 울린 것으로 보고 결함 탐색에서 제외합니다. 모르면 비워두세요. 대신 고주파 분석을 제한 없이 신뢰하게 되므로, 자석 마운트라면 꼭 선택하는 것이 좋습니다.":"How the sensor is attached to the machine. Choose stud if screwed on, adhesive if bonded, magnet if magnetic, or hand probe if held by hand. The reliable upper frequency differs by method (stud 10, adhesive 5, magnet 2, probe 1 kHz), so bands above it are treated as mounting resonance rather than the machine and excluded from the fault search. Leave blank if unknown — but high-frequency analysis will then be trusted without limit, so for magnet mounts be sure to select it.","모터의 힘이 기계로 전달되는 방식입니다. 축이 커플링으로 바로 이어져 있으면 직결, 벨트가 보이면 벨트, 기어박스를 거치면 기어입니다. 벨트를 고르고 풀리 지름을 넣으면 종동축 회전수가 계산되어, 정체를 알 수 없던 진동 성분이 종동축 것인지 밝힐 수 있습니다.":"How motor power is transmitted to the machine. Direct if the shafts are joined by a coupling, belt if you can see a belt, gear if it goes through a gearbox. Choosing belt and entering the pulley diameters computes the driven-shaft speed, which can reveal whether an unidentified vibration component comes from the driven shaft.","펌프나 팬이면 임펠러 날개 개수, 기어 구동이면 잇수입니다. 명판이나 사양서에서 확인하세요. 날개수에 회전수를 곱한 것이 베인 통과 주파수이며, 이 성분이 크면 유동 이상이나 간극 문제를 가리킵니다. 모르면 반드시 비워두세요. 추측으로 넣으면 그 값이 그대로 판정 근거가 됩니다.":"The number of impeller vanes for a pump or fan, or the tooth count for a gear drive. Check the nameplate or spec sheet. Vane count × speed gives the vane pass frequency; a large component there points to flow problems or clearance issues. If unknown, be sure to leave it blank — a guessed value becomes assessment evidence as is.","이 센서가 붙은 축입니다. 모터 쪽 베어링이면 모터측, 벨트 반대편(팬·펌프 등) 베어링이면 종동측을 고릅니다.\n\n종동측이면 결함 패턴·결함 주파수·대역을 종동축 회전수로 계산합니다(모터 RPM × 구동 풀리경 ÷ 종동 풀리경). 회전수가 1~2%만 틀려도 결함 부위 판단이 흔들리므로, 타코미터 등으로 잰 종동축 회전수가 있으면 직접 입력하세요.":`The shaft this sensor is on. Choose motor side for a motor-side bearing, or driven side for a bearing on the far side of the belt (fan, pump, etc.).

For driven side, the fault pattern, defect frequencies and bands are computed from the driven-shaft speed (motor RPM × drive pulley diameter ÷ driven pulley diameter). Even a 1~2% speed error can throw off the fault location, so if you have a driven-shaft speed measured with a tachometer or similar, enter it directly.`,"풀리 두 개의 피치 지름(벨트가 감기는 위치의 지름 — 풀리 각인·카탈로그 값, 바깥지름보다 조금 작음)과 벨트 총길이입니다. 벨트 길이는 벨트 옆면의 각인(예: A-50, 5V1200)에서 확인합니다. 지름 두 개만 있으면 종동축 회전수가 나오고, 길이까지 있으면 벨트 자체 결함(균열·결손)의 주파수도 계산됩니다.":"The pitch diameters of the two pulleys (the diameter where the belt wraps — from the pulley marking or catalog, slightly smaller than the outer diameter) and the total belt length. The belt length is on the belt's side marking (e.g. A-50, 5V1200). The two diameters alone give the driven-shaft speed; with the length as well, the frequency of belt defects (cracks, missing pieces) is also computed.","이 주기마다 결함 패턴을 재서 등급을 매기므로, 등급 확정의 회차 길이도 이 주기가 정합니다. 대역 에너지와 결함 패턴은 시간·일 단위로 변하는 값이라 평상시엔 10분이면 충분합니다. 정지·신호 두절·계측 이상은 판정 주기마다 따로 봅니다.\n\n다만 베이스라인 학습에는 표본 30개가 필요해 10분 주기면 5시간이 걸립니다. 처음 도입할 때는 과거 채우기로 지난 구간을 소급 추출하면 기다리지 않고 바로 학습할 수 있습니다.\n\n40대 기준 서버 부하 — 10분 5.5% · 30분 1.8% · 1시간 0.9%":`The fault pattern is measured and the grade assigned at each interval, so this interval also sets the cycle length for grade confirmation. Band energy and fault patterns change over hours to days, so 10 minutes is normally enough. Stops, signal loss and sensor faults are checked separately at every assessment interval.

However, baseline learning needs 30 samples, which takes 5 hours at a 10-minute interval. When first deploying, use backfill to extract past ranges retroactively and learn right away without waiting.

Server load for 40 units — 10 min 5.5% · 30 min 1.8% · 1 h 0.9%`,"모터에 공급되는 상용전원의 주파수로, 한국은 60 Hz입니다. 전기적 결함은 이 값의 2배(120 Hz)에서 나타나며, 기계적 결함과 달리 회전수가 변해도 움직이지 않는 것이 구분 기준입니다. 입력된 RPM이 다른 계통의 동기속도에 맞으면 경고를 표시합니다.":"The frequency of the mains power supplied to the motor; 60 Hz in Korea. Electrical faults appear at twice this value (120 Hz) and, unlike mechanical faults, do not shift when the speed changes — that is how they are told apart. A warning is shown if the entered RPMs match the synchronous speed of the other line frequency.","베어링의 제조사·품번입니다(예: SKF 22218 E). 판정에는 쓰지 않고, 상세분석·리포트에 어떤 베어링인지 표시합니다. 형상값은 이 품번의 제조사 카탈로그에서 옮겨 적습니다.":"The bearing manufacturer and part number (e.g. SKF 22218 E). Not used for assessment; it shows which bearing is installed in Detailed analysis and Reports. Copy the geometry values from the manufacturer's catalog for this part number.","전동체(볼 또는 롤러)의 개수입니다. 베어링 제조사 카탈로그의 형상 제원에서 확인합니다. 네 값이 모두 있어야 결함 주파수가 계산됩니다.":"The number of rolling elements (balls or rollers). Found in the geometry data of the bearing manufacturer's catalog. All four values are needed to compute defect frequencies.","전동체 하나의 지름(mm)입니다. 카탈로그의 ball diameter 항목입니다.":"The diameter of one rolling element (mm). The catalog's ball diameter entry.","전동체들의 중심을 잇는 원의 지름(mm)입니다. 카탈로그의 pitch diameter 항목이며, 대략 (내경+외경)÷2입니다.":"The diameter (mm) of the circle through the centers of the rolling elements. The catalog's pitch diameter entry, roughly (bore + outer diameter)÷2.","전동체가 궤도면과 닿는 각도입니다. 깊은홈 볼베어링은 0°, 앵귤러 콘택트는 15~40°입니다. 모르면 0으로 두세요.":"The angle at which the rolling elements contact the raceway. 0° for deep-groove ball bearings, 15~40° for angular contact. If unknown, leave it at 0.","ISO 존 A와 B를 가르는 경계입니다. A는 신품 수준의 진동, B는 제한 없이 장기 운전할 수 있는 수준입니다. 측정값이 이 값을 넘으면 ISO 존이 B로 표시됩니다. 등급은 결함 패턴이 잡혀야 켜지고 켜지면 최소 주의라, 이 경계는 등급을 바꾸지 않습니다.":"The boundary between ISO zones A and B. A is new-machine vibration; B is acceptable for unrestricted long-term operation. Values above this show ISO zone B. A grade turns on only when a fault pattern is detected, and is at least Warning when on, so this boundary does not change the grade.","ISO 존 B와 C를 가르는 경계입니다. C부터는 장기 운전에 부적합한 수준이라 조치 권고가 여기서 갈립니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 위험으로 올라갑니다. 세 경계 중 실무에서 가장 중요한 값입니다.":"The boundary between ISO zones B and C. From C onward the level is unsuitable for long-term operation, so this is where action recommendations diverge. Equipment with a detected fault pattern above this value rises to Danger. In practice, the most important of the three boundaries.","ISO 존 C와 D를 가르는 경계입니다. D는 기계에 손상을 일으킬 수 있는 수준으로, 긴급 점검 대상입니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 심각으로 올라갑니다.":"The boundary between ISO zones C and D. D is a level that can damage the machine and calls for urgent inspection. Equipment with a detected fault pattern above this value rises to Critical.","수정한 임계값을 ISO 10816 기본값으로 되돌립니다. 값을 직접 수정하면 그때부터는 규격이 아니라 사용자 정의 기준으로 판정한다는 점을 유의하세요.":"Reverts edited thresholds to the ISO 10816 defaults. Note that once you edit the values, assessment uses your custom criteria rather than the standard.",'이 구간의 데이터를 "정상 상태"로 간주해 중심(μ)과 평소 변동(σ)을 학습합니다. 정지·기동 구간과 순간 스파이크는 자동으로 걸러지지만, 결함이 이미 진행 중인 기간으로 학습하면 그 결함이 정상 기준이 됩니다 — 정상 운전이 확실한 기간을 고르세요. 길수록 다양한 운전 상태가 포함돼 기준이 견고해집니다.':'Treats data in this range as the "normal state" and learns its center (μ) and usual variation (σ). Stop/start-up periods and momentary spikes are filtered out automatically, but learning from a period when a fault was already developing makes that fault the normal reference — pick a period of clearly normal operation. Longer periods cover more operating states and make the reference more robust.',"평소 변동(σ)의 몇 배까지를 정상으로 볼지 정하는 값입니다. k=3이면 정상 데이터의 약 99.7%가 한계 안에 들어옵니다. 낮추면 민감해져 급증을 일찍 잡는 대신 오탐이 늘고, 높이면 그 반대입니다. 확신이 없으면 3을 그대로 두세요.":"How many multiples of the usual variation (σ) count as normal. With k=3, about 99.7% of normal data falls within the limit. Lowering it increases sensitivity, catching surges earlier but with more false alarms; raising it does the opposite. If unsure, leave it at 3.","얼마나 자주 판정하는지입니다.\n3초면 3초마다 한 번씩, 그때까지의 RMS 구간을 평가합니다.\n\n짧게 하면 변화를 빨리 알지만 조회가 그만큼 늘어납니다. 조회는 테이블당 한 번이라 태그 수와는 무관합니다.":`How often assessment runs.
At 3 seconds, the RMS window up to that point is evaluated every 3 seconds.

Shorter intervals detect changes sooner but increase queries accordingly. Queries are one per table, regardless of the number of tags.`,"얼마나 자주 판정하는지입니다.\n3초면 3초마다 한 번씩, 그때까지의 RMS 구간을 평가합니다.":`How often assessment runs.
At 3 seconds, the RMS window up to that point is evaluated every 3 seconds.`,"대역별 정상 기준을 배울 구간입니다. 베이스라인과 따로 두는 이유는 표본 밀도가 달라서입니다 — 대역은 추출 주기마다 하나씩만 생깁니다(10분 주기면 24시간에 144개).":"The period for learning per-band normal references. It is kept separate from the baseline because the sample density differs — bands produce only one value per extraction interval (144 in 24 hours at a 10-minute interval).","이 구간에 들어온 원본 전체로 실효값 하나를 냅니다. 길면 짧은 진동이 하나의 상태로 합쳐지고, 짧으면 변화를 잘게 봅니다.\n\n등급은 이 값이 정하지 않습니다 — 결함 패턴이 추출 주기마다 정하고, 이 값은 운전 여부·신호 두절·계측 이상·평소 대비를 봅니다.":`Computes one RMS value from all raw data in this window. Longer windows merge short vibrations into one state; shorter ones show changes in finer detail.

This value does not set the grade — the fault pattern does, at each extraction interval; this value covers running state, signal loss, sensor faults and vs.-normal comparison.`,"입력된 RPM {0}건이 {1} Hz 계통 동기속도에 맞습니다 — 설정 확인 필요":"{0} entered RPM values match the {1} Hz synchronous speed — check settings","RPM {0}건과 정합":"Consistent with {0} RPM values","임계값을 기본값으로 되돌렸습니다 — 저장해야 적용됩니다":"Thresholds reverted to defaults — save to apply","학습값이 남아 있습니다 — 이전과 같은 설비인가요?":"Learned values remain — is this the same equipment as before?",'방금 추가된 이 태그에 예전 학습값(μ·σ)이 그대로 남아 있습니다.\n\n같은 설비라면 그대로 쓰면 되지만, 다른 설비에 같은 이름을 붙인 것이라면 남의 기준으로 판정하게 됩니다.\n새 설비가 더 조용하면 이탈이 영영 안 잡히고, 더 시끄러우면 이탈이 계속 표시됩니다. 둘 다 화면에는 "학습됨"으로만 보입니다.\n\n확인할 때까지 베이스라인·대역 판정을 멈춥니다. ISO 존 등급은 절대 기준이라 계속 판정합니다.{0}':`This newly added tag still has old learned values (μ·σ).

ー)回転周波数(Fundamental Train Frequency)です。通常は回転周波数の0.35~0.45倍で、保持器の損傷・潤滑不良時にこの成分が現れます。","— 선택 —":"— 選択 —","I · 소형":"I · 小型","II · 중형":"II · 中型","III · 대형·강성":"III · 大型·剛基礎","IV · 대형·연성":"IV · 大型·柔基礎",닫기:"閉じる",설정:"設定","{0} (직접)":"{0} (直接)","{0}은(는) 제조사·설계(E·CC·CA 등)마다 롤러 수가 달라 목록에서 뺐습니다 — 옛 목록 값을 넣어 두었으니 제조사 카탈로그 값으로 확인하세요":"{0}はメーカー・設計(E·CC·CAなど)によってころ数が異なるためリストから外しました — 旧リストの値を入れてあるので、メーカーカタログの値で確認してください","— 미상 —":"— 不明 —","스터드(나사)":"スタッド(ねじ)",접착:"接着",자석:"マグネット",핸드프로브:"ハンドプローブ",직결:"直結","벨트·풀리":"ベルト·プーリー",기어:"ギア","풀리경 또는 종동축 회전수가 있어야 결함 패턴을 잴 수 있습니다":"プーリー径または従動軸回転数がないと欠陥パターンを測定できません","결함 대조 회전수 {0} rpm (종동축 · {1})":"欠陥照合回転数 {0} rpm (従動軸 · {1})","종동축 1× {0} Hz (비 {1})":"従動軸 1× {0} Hz (比 {1})",종동:"従動","종동측 센서 — 풀리경이나 종동축 회전수가 없어 결함 패턴을 잴 수 없습니다":"従動側センサー — プーリー径または従動軸回転数がないため欠陥パターンを測定できません","종동축 {0} rpm으로 대조 ({1})":"従動軸 {0} rpmで照合 ({1})","풀리비 {0} 환산":"プーリー比 {0} 換算","{0} (풀리 환산)":"{0} (プーリー換算)","모르면 비워 두세요":"不明なら空欄のままにしてください","베인 통과 {0} Hz":"ベーン通過 {0} Hz","판정 불가":"判定不可",'회전수와 베어링 기하가 둘 다 있어야 결함주파수 격자를 세울 수 있습니다. 하나라도 없으면 등급을 켜는 축이 비어 카드가 "판정 보류"로 남습니다(미끄럼 베어링도 구름체가 없어 여기 포함됩니다). 좌측 "판정 불가" 배지와 같은 기준·같은 수입니다.':"回転数と軸受の幾何形状が両方そろって初めて欠陥周波数の格子を立てられます。どちらかが欠けると等級をオンにする軸が空になり、カードは「判定保留」のままになります(すべり軸受も転動体がないためここに含まれます)。左側の「判定不可」バッジと同じ基準・同じ数です。","같은 설비 {0}*":"同じ設備 {0}*","같은 테이블 {0}":"同じテーブル {0}","목록 전체":"リスト全体","지금 걸러진 목록":"現在の絞り込みリスト",스터드:"スタッド",베어링:"ベアリング",구동:"駆動",종동측:"従動側",모터측:"モーター側","풀리 D1":"プーリー D1","풀리 D2":"プーリー D2","종동축 회전수":"従動軸回転数",개:"個",매:"枚","{0} · {1}개":"{0} · {1}件","태그 {0}개에 적용":"タグ{0}個に適用","대상 태그의 해당 항목을 덮어씁니다. 끈 항목과 이 행에 값이 없는 항목은 건드리지 않습니다.":"対象タグの該当項目を上書きします。オフにした項目とこの行に値がない項目は変更しません。","브라우저 시간{0}":"ブラウザー時間{0}","지금 {0}{1}":"現在 {0}{1}"," · 저장하면 적용됩니다":" · 保存すると適用されます","센서가 저장하는 물리량입니다. mm/s는 속도, g는 가속도, μm는 변위이며, 데이터를 넣을 때 이미 정해진 값이라 모르면 계측 담당자에게 확인하세요. 등급의 높이는 속도(mm/s) 기준 ISO 10816 존으로 정하며, 가속도·변위 센서도 값을 속도로 환산해 판정하므로 단위가 틀리면 등급 높이가 틀어집니다.":"センサーが保存する物理量です。mm/sは速度、gは加速度、μmは変位で、データ投入時にすでに決まっている値のため、不明な場合は計測担当者に確認してください。等級の高さは速度(mm/s)基準のISO 10816ゾーンで決め、加速度・変位センサーも値を速度に換算して判定するため、単位が誤っていると等級の高さがずれます。","ISO 10816 기계 등급으로, 기계의 출력과 기초 강성에 따라 정합니다. I은 소형(15 kW 이하), II는 중형(15~75 kW), III·IV는 대형(각각 강성·연성 기초)입니다. 같은 진동값이라도 등급에 따라 양호/위험 판정이 달라집니다. 비워두면 Class II 기준(1.12 / 2.80 / 7.10 mm/s)으로 판정합니다.":"ISO 10816の機械クラスで、機械の出力と基礎の剛性によって決まります。Iは小型(15 kW以下)、IIは中型(15~75 kW)、III·IVは大型(それぞれ剛基礎・柔基礎)です。同じ振動値でもクラスによって良好/危険の判定が変わります。空欄の場合はClass II基準(1.12 / 2.80 / 7.10 mm/s)で判定します。","이 계측점 베어링이 달린 축의 실제 운전 회전수입니다. 명판의 정격 회전수(예: 1750)를 넣고 동기속도(1800)는 넣지 마십시오. 결함 패턴은 이 값으로 결함 주파수를 계산해 허용오차 1%로 대조하므로, 1% 넘게 틀리면 결함을 놓칩니다. 스펙트럼에서 잰 실측 회전수는 차수 라벨·스펙트럼 해석에 쓰고, 입력값과 2% 넘게 다르면 상세분석에서 알려 드립니다. 자릿수는 반드시 맞아야 합니다 — 3600 rpm 설비에 1800을 넣으면 모든 주파수 해석과 대역 경계가 절반으로 어긋납니다. 비워 두면 회전수 미상으로 처리해 결함 패턴 판정과 대역 추출이 멈추고 등급이 서지 않습니다.\n\n· 감속기(기어) 출력축의 센서면 그 축의 회전수(모터 회전수 ÷ 감속비)를 넣으십시오.\n· 벨트 구동이면 모터의 정격 회전수를 넣고, 센서가 벨트 반대편(팬·펌프 등)이면 설비 설정의 센서 위치를 종동측으로 고르십시오 — 풀리비로 환산합니다.":`この計測点の軸受が付いている軸の実際の運転回転数です。銘板の定格回転数(例: 1750)を入力し、同期速度(1800)は入力しないでください。欠陥パターンはこの値で欠陥周波数を計算し許容誤差1%で照合するため、1%を超えてずれると欠陥を見逃します。スペクトルで測定した実測回転数は次数ラベル・スペクトル解析に使い、入力値と2%を超えて異なる場合は詳細分析でお知らせします。桁は必ず合わせてください — 3600 rpmの設備に1800を入力すると、すべての周波数解析と帯域境界が半分にずれます。空欄にすると回転数不明として扱い、欠陥パターン判定と帯域抽出が停止して等級が付きません。

· 減速機(ギア)出力軸のセンサーであれば、その軸の回転数(モーター回転数 ÷ 減速比)を入力してください。
· ベルト駆動の場合はモーターの定格回転数を入力し、センサーがベルトの反対側(ファン・ポンプなど)にあれば、設備設定のセンサー位置を従動側に選択してください — プーリー比で換算します。`,"설치된 구름베어링의 품번입니다. 베어링 외륜의 각인이나 정비 이력에서 확인할 수 있습니다. 품번을 고르면 결함 주파수(BPFO/BPFI/BSF/FTF)가 자동 계산되어 베어링 결함을 판정할 수 있게 됩니다. 저널(유막) 베어링이면 sleeve를, 목록에 없는 품번이면 직접 입력을 고르세요. 비워두면 베어링 결함은 판정하지 않습니다.":"設置された転がり軸受の型番です。軸受外輪の刻印や整備履歴で確認できます。型番を選ぶと欠陥周波数(BPFO/BPFI/BSF/FTF)が自動計算され、軸受欠陥を判定できるようになります。ジャーナル(油膜)軸受ならsleeveを、リストにない型番なら直接入力を選んでください。空欄の場合、軸受欠陥は判定しません。","센서를 기계에 붙인 방법입니다. 나사로 고정했으면 스터드, 본드로 붙였으면 접착, 자석이면 자석, 손으로 대고 재면 핸드프로브를 고르세요. 방식에 따라 믿을 수 있는 주파수 상한이 달라서(스터드 10, 접착 5, 자석 2, 프로브 1 kHz) 그보다 높은 대역은 기계가 아니라 마운팅이 울린 것으로 보고 결함 탐색에서 제외합니다. 모르면 비워두세요. 대신 고주파 분석을 제한 없이 신뢰하게 되므로, 자석 마운트라면 꼭 선택하는 것이 좋습니다.":"センサーを機械に取り付けた方法です。ねじで固定したならスタッド、ボンドで貼ったなら接着、磁石ならマグネット、手で当てて測るならハンドプローブを選んでください。方式によって信頼できる周波数の上限が異なるため(スタッド10、接着5、マグネット2、プローブ1 kHz)、それより高い帯域は機械ではなく取付け部が共振したものとみなし、欠陥探索から除外します。不明なら空欄にしてください。ただし高周波分析を無制限に信頼することになるため、マグネット取付けの場合は必ず選択することをお勧めします。","모터의 힘이 기계로 전달되는 방식입니다. 축이 커플링으로 바로 이어져 있으면 직결, 벨트가 보이면 벨트, 기어박스를 거치면 기어입니다. 벨트를 고르고 풀리 지름을 넣으면 종동축 회전수가 계산되어, 정체를 알 수 없던 진동 성분이 종동축 것인지 밝힐 수 있습니다.":"モーターの動力が機械に伝わる方式です。軸がカップリングで直接つながっていれば直結、ベルトが見えればベルト、ギアボックスを介していればギアです。ベルトを選んでプーリー径を入力すると従動軸回転数が計算され、正体不明だった振動成分が従動軸のものかどうかを明らかにできます。","펌프나 팬이면 임펠러 날개 개수, 기어 구동이면 잇수입니다. 명판이나 사양서에서 확인하세요. 날개수에 회전수를 곱한 것이 베인 통과 주파수이며, 이 성분이 크면 유동 이상이나 간극 문제를 가리킵니다. 모르면 반드시 비워두세요. 추측으로 넣으면 그 값이 그대로 판정 근거가 됩니다.":"ポンプやファンならインペラの羽根枚数、ギア駆動なら歯数です。銘板や仕様書で確認してください。羽根数に回転数を掛けたものがベーン通過周波数で、この成分が大きい場合は流動異常や隙間の問題を示します。不明な場合は必ず空欄にしてください。推測で入力するとその値がそのまま判定根拠になります。","이 센서가 붙은 축입니다. 모터 쪽 베어링이면 모터측, 벨트 반대편(팬·펌프 등) 베어링이면 종동측을 고릅니다.\n\n종동측이면 결함 패턴·결함 주파수·대역을 종동축 회전수로 계산합니다(모터 RPM × 구동 풀리경 ÷ 종동 풀리경). 회전수가 1~2%만 틀려도 결함 부위 판단이 흔들리므로, 타코미터 등으로 잰 종동축 회전수가 있으면 직접 입력하세요.":`このセンサーが付いている軸です。モーター側の軸受ならモーター側、ベルトの反対側(ファン・ポンプなど)の軸受なら従動側を選びます。

従動側の場合、欠陥パターン・欠陥周波数・帯域を従動軸回転数で計算します(モーターRPM × 駆動プーリー径 ÷ 従動プーリー径)。回転数が1~2%ずれるだけでも欠陥部位の判断が揺らぐため、タコメーターなどで測定した従動軸回転数があれば直接入力してください。`,"풀리 두 개의 피치 지름(벨트가 감기는 위치의 지름 — 풀리 각인·카탈로그 값, 바깥지름보다 조금 작음)과 벨트 총길이입니다. 벨트 길이는 벨트 옆면의 각인(예: A-50, 5V1200)에서 확인합니다. 지름 두 개만 있으면 종동축 회전수가 나오고, 길이까지 있으면 벨트 자체 결함(균열·결손)의 주파수도 계산됩니다.":"2つのプーリーのピッチ径(ベルトが巻き付く位置の直径 — プーリーの刻印・カタログ値、外径より少し小さい)とベルトの全長です。ベルト長はベルト側面の刻印(例: A-50, 5V1200)で確認します。径が2つあれば従動軸回転数が求まり、長さまであればベルト自体の欠陥(亀裂・欠損)の周波数も計算されます。","이 주기마다 결함 패턴을 재서 등급을 매기므로, 등급 확정의 회차 길이도 이 주기가 정합니다. 대역 에너지와 결함 패턴은 시간·일 단위로 변하는 값이라 평상시엔 10분이면 충분합니다. 정지·신호 두절·계측 이상은 판정 주기마다 따로 봅니다.\n\n다만 베이스라인 학습에는 표본 30개가 필요해 10분 주기면 5시간이 걸립니다. 처음 도입할 때는 과거 채우기로 지난 구간을 소급 추출하면 기다리지 않고 바로 학습할 수 있습니다.\n\n40대 기준 서버 부하 — 10분 5.5% · 30분 1.8% · 1시간 0.9%":`この周期ごとに欠陥パターンを測定して等級を付けるため、等級確定の回次の長さもこの周期で決まります。帯域エネルギーと欠陥パターンは時間・日単位で変わる値なので、平常時は10分で十分です。停止・信号途絶・計測異常は判定周期ごとに別途確認します。

ただしベースライン学習にはサンプル30個が必要で、10分周期だと5時間かかります。初めて導入するときは過去分の補完で過去の区間を遡って抽出すれば、待たずにすぐ学習できます。

40台基準のサーバー負荷 — 10分 5.5% · 30分 1.8% · 1時間 0.9%`,"모터에 공급되는 상용전원의 주파수로, 한국은 60 Hz입니다. 전기적 결함은 이 값의 2배(120 Hz)에서 나타나며, 기계적 결함과 달리 회전수가 변해도 움직이지 않는 것이 구분 기준입니다. 입력된 RPM이 다른 계통의 동기속도에 맞으면 경고를 표시합니다.":"モーターに供給される商用電源の周波数で、韓国は60 Hzです。電気的欠陥はこの値の2倍(120 Hz)に現れ、機械的欠陥と異なり回転数が変わっても動かないことが区別の基準です。入力されたRPMが別の系統周波数の同期速度に合う場合は警告を表示します。","베어링의 제조사·품번입니다(예: SKF 22218 E). 판정에는 쓰지 않고, 상세분석·리포트에 어떤 베어링인지 표시합니다. 형상값은 이 품번의 제조사 카탈로그에서 옮겨 적습니다.":"軸受のメーカー・型番です(例: SKF 22218 E)。判定には使わず、詳細分析・レポートにどの軸受かを表示します。形状値はこの型番のメーカーカタログから転記します。","전동체(볼 또는 롤러)의 개수입니다. 베어링 제조사 카탈로그의 형상 제원에서 확인합니다. 네 값이 모두 있어야 결함 주파수가 계산됩니다.":"転動体(ボールまたはころ)の個数です。軸受メーカーのカタログの形状諸元で確認します。4つの値がすべてそろうと欠陥周波数が計算されます。","전동체 하나의 지름(mm)입니다. 카탈로그의 ball diameter 항목입니다.":"転動体1個の直径(mm)です。カタログのball diameter項目です。","전동체들의 중심을 잇는 원의 지름(mm)입니다. 카탈로그의 pitch diameter 항목이며, 대략 (내경+외경)÷2입니다.":"転動体の中心を結ぶ円の直径(mm)です。カタログのpitch diameter項目で、おおよそ(内径+外径)÷2です。","전동체가 궤도면과 닿는 각도입니다. 깊은홈 볼베어링은 0°, 앵귤러 콘택트는 15~40°입니다. 모르면 0으로 두세요.":"転動体が軌道面と接する角度です。深溝玉軸受は0°、アンギュラ玉軸受は15~40°です。不明なら0のままにしてください。","ISO 존 A와 B를 가르는 경계입니다. A는 신품 수준의 진동, B는 제한 없이 장기 운전할 수 있는 수준입니다. 측정값이 이 값을 넘으면 ISO 존이 B로 표시됩니다. 등급은 결함 패턴이 잡혀야 켜지고 켜지면 최소 주의라, 이 경계는 등급을 바꾸지 않습니다.":"ISOゾーンAとBを分ける境界です。Aは新品レベルの振動、Bは制限なく長期運転できるレベルです。測定値がこの値を超えるとISOゾーンがBと表示されます。等級は欠陥パターンが捉えられて初めてオンになり、オンになると最低でも注意のため、この境界は等級を変えません。","ISO 존 B와 C를 가르는 경계입니다. C부터는 장기 운전에 부적합한 수준이라 조치 권고가 여기서 갈립니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 위험으로 올라갑니다. 세 경계 중 실무에서 가장 중요한 값입니다.":"ISOゾーンBとCを分ける境界です。Cからは長期運転に不適なレベルのため、対処の推奨がここで分かれます。欠陥パターンが捉えられた設備がこの値を超えると等級が危険に上がります。3つの境界のうち実務で最も重要な値です。","ISO 존 C와 D를 가르는 경계입니다. D는 기계에 손상을 일으킬 수 있는 수준으로, 긴급 점검 대상입니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 심각으로 올라갑니다.":"ISOゾーンCとDを分ける境界です。Dは機械に損傷を与えうるレベルで、緊急点検の対象です。欠陥パターンが捉えられた設備がこの値を超えると等級が重大に上がります。","수정한 임계값을 ISO 10816 기본값으로 되돌립니다. 값을 직접 수정하면 그때부터는 규격이 아니라 사용자 정의 기준으로 판정한다는 점을 유의하세요.":"変更したしきい値をISO 10816の既定値に戻します。値を直接変更すると、それ以降は規格ではなくユーザー定義の基準で判定することに注意してください。",'이 구간의 데이터를 "정상 상태"로 간주해 중심(μ)과 평소 변동(σ)을 학습합니다. 정지·기동 구간과 순간 스파이크는 자동으로 걸러지지만, 결함이 이미 진행 중인 기간으로 학습하면 그 결함이 정상 기준이 됩니다 — 정상 운전이 확실한 기간을 고르세요. 길수록 다양한 운전 상태가 포함돼 기준이 견고해집니다.':"この区間のデータを「正常状態」とみなし、中心(μ)と普段の変動(σ)を学習します。停止・起動区間や瞬間的なスパイクは自動で除外されますが、欠陥がすでに進行中の期間で学習するとその欠陥が正常基準になります — 正常運転が確かな期間を選んでください。長いほど多様な運転状態が含まれ、基準が堅牢になります。","평소 변동(σ)의 몇 배까지를 정상으로 볼지 정하는 값입니다. k=3이면 정상 데이터의 약 99.7%가 한계 안에 들어옵니다. 낮추면 민감해져 급증을 일찍 잡는 대신 오탐이 늘고, 높이면 그 반대입니다. 확신이 없으면 3을 그대로 두세요.":"普段の変動(σ)の何倍までを正常とみなすかを決める値です。k=3なら正常データの約99.7%が限界内に収まります。下げると敏感になり急増を早く捉える代わりに誤検知が増え、上げるとその逆です。確信がなければ3のままにしてください。","얼마나 자주 판정하는지입니다.\n3초면 3초마다 한 번씩, 그때까지의 RMS 구간을 평가합니다.\n\n짧게 하면 변화를 빨리 알지만 조회가 그만큼 늘어납니다. 조회는 테이블당 한 번이라 태그 수와는 무관합니다.":`どのくらいの頻度で判定するかです。
3秒なら3秒ごとに1回、その時点までのRMS区間を評価します。

短くすると変化を早く把握できますが、照会がその分増えます。照会はテーブルごとに1回のため、タグ数とは無関係です。`,"얼마나 자주 판정하는지입니다.\n3초면 3초마다 한 번씩, 그때까지의 RMS 구간을 평가합니다.":`どのくらいの頻度で判定するかです。
3秒なら3秒ごとに1回、その時点までのRMS区間を評価します。`,"대역별 정상 기준을 배울 구간입니다. 베이스라인과 따로 두는 이유는 표본 밀도가 달라서입니다 — 대역은 추출 주기마다 하나씩만 생깁니다(10분 주기면 24시간에 144개).":"帯域ごとの正常基準を学習する区間です。ベースラインと別に設けるのはサンプル密度が異なるためです — 帯域は抽出周期ごとに1つしか生成されません(10分周期なら24時間で144個)。","이 구간에 들어온 원본 전체로 실효값 하나를 냅니다. 길면 짧은 진동이 하나의 상태로 합쳐지고, 짧으면 변화를 잘게 봅니다.\n\n등급은 이 값이 정하지 않습니다 — 결함 패턴이 추출 주기마다 정하고, 이 값은 운전 여부·신호 두절·계측 이상·평소 대비를 봅니다.":`この区間に入った元データ全体から実効値を1つ算出します。長いと短い振動が1つの状態にまとめられ、短いと変化を細かく見ます。

ーンAでも、普段からの急増を見分けられます。","추정은 스파이크에 흔들리지 않는 중앙값 방식이고, 정지·기동 구간은 학습에서 자동 제외됩니다.":"推定はスパイクに左右されない中央値方式で、停止・起動区間は学習から自動的に除外されます。","학습은 선택 사항이며, 등급 판정(결함 패턴·존 경계)은 학습과 무관하게 항상 동작합니다.":"学習は任意で、等級判定(欠陥パターン・ゾーン境界)は学習と関係なく常に動作します。","미학습 태그":"未学習タグ","— 등급 판정은 되지만 평소 대비 급증(베이스라인 이탈)은 표시되지 않습니다. 보려면 아래에서 학습하세요.":"— 等級判定は行われますが、普段からの急増(ベースライン逸脱)は表示されません。表示するには下で学習してください。","학습한 지 한 달이 넘은 태그":"学習から1か月以上経ったタグ","— 그 사이 정비나 운전 조건 변경이 있었다면 지금 기준은 정상을 대표하지 않습니다. 각 행의":"— その間に保全や運転条件の変更があった場合、現在の基準は正常を代表しません。各行の",학습:"学習","으로 갱신하십시오.":"で更新してください。","정상 학습 기간":"正常学習期間","최근 1시간":"直近1時間","최근 24시간":"直近24時間","k (σ 배수)":"k (σ倍数)","기간이 길수록 다양한 정상 운전 상태를 포함해 기준이 견고해집니다(대표성↑). 데이터가 그보다 짧으면 있는 만큼만 학습합니다. 표본은 판정과 같은 RMS 구간 단위로 묶어 판정 값과 기준이 같습니다.":"期間が長いほど多様な正常運転状態を含み、基準が堅牢になります(代表性↑)。データがそれより短ければ、ある分だけ学習します。サンプルは判定と同じRMS区間単位でまとめるため、判定値と基準が一致します。","확인 대기":"確認待ち","— 답할 때까지 이 태그들은 학습 기반 판정이 멈춰 있습니다":"— 回答するまで、これらのタグの学習ベースの判定は停止しています","모두 같은 설비 — 유지":"すべて同じ設備 — 維持","선택된 데이터 소스가 없습니다 — 데이터 소스에서 테이블을 먼저 선택하세요.":"データソースが選択されていません — 先にデータソースでテーブルを選択してください。","이 기준을 학습한 시점입니다. 설비 정비나 운전 조건 변경 뒤의 기준은 정상을 대표하지 않으니 다시 학습하십시오.":"この基準を学習した時点です。設備の保全や運転条件の変更後の基準は正常を代表しないため、再学習してください。","같은 설비 — 유지":"同じ設備 — 維持","다른 설비 — 초기화":"別の設備 — 初期化","대역 에너지 추세":"帯域エネルギー傾向","전체 RMS로는 안 보이는 변화를 잡습니다 — 베어링 결함이 커져도 전체는 거의 안 움직이지만 해당 대역만 보면 몇 배로 뜁니다.":"全体RMSでは見えない変化を捉えます — 軸受欠陥が大きくなっても全体はほとんど動きませんが、該当帯域だけを見ると数倍に跳ね上がります。","대역·결함 패턴 추출":"帯域・欠陥パターン抽出","켜져 있지만 조건을 갖춘 태그가 없어":"オンになっていますが、条件を満たすタグがないため","추출이 돌지 않습니다":"抽出が動作していません",". 설비 정보에서 RPM을 입력하십시오.":"。設備情報でRPMを入力してください。","추출 주기":"抽出周期","주기가 짧을수록 표본이 빨리 쌓입니다":"周期が短いほどサンプルが早くたまります","정상 기준 학습":"正常基準の学習","정상 운전이 확실할 때 학습하십시오 — 결함이 진행 중이면 그 결함이 정상 기준이 됩니다.":"正常運転が確実なときに学習してください — 欠陥が進行中なら、その欠陥が正常基準になります。","대역 학습 기간":"帯域学習期間","과거 데이터 채우기":"過去データの補完",중지:"停止",채우기:"補完","남은 시간 약":"残り約","학습 가능 ✓":"学習可能 ✓","학습 최소 표본 미달":"学習の最小サンプル数に未達","채널별 학습 상태":"チャネル別学習状態",학습됨:"学習済み","선택된 데이터 소스가 없습니다.":"データソースが選択されていません。","대역 베이스라인 삭제":"帯域ベースラインを削除","주기적으로 설비를 판정해 등급이 바뀌거나 신호 두절·계측 이상이 생기면 이벤트를 기록합니다. 판정 기준( [답할 질문 — 이 순서로]
1) 지금 상태가 어떻게 보이나
2) 왜 그렇게 보이나 — 판정을 받치는 근거와 확정을 막는 것
3) 어떤 행동이 권장되나 — [지금 할 일]과 [세부 조치]를 쉬운 말로, 왜 하는지 붙여서

[쉬운 말로 바꾸기 — 아래 용어는 본문에 그대로 쓰지 않는다]
· BPFO → 베어링 바깥 궤도 쪽 신호 · BPFI → 안쪽 궤도 쪽 신호 · BSF → 베어링 볼 쪽 신호 · FTF → 볼을 잡아주는 케이지 쪽 신호
· 포락선 분석 → 짧은 충격이 되풀이되는지 보는 분석 · 측대역 → 신호 세기가 주기적으로 오르내리는 흔적 · 하모닉 → 같은 신호의 배수 성분
· 반복성 미확인 → 충격이 되풀이되는지 아직 확인 안 됨 · 독립 회전원 → 이 설비 축과 다른 속도로 도는 회전체(옆 기계 · 벨트로 이어진 다른 축)
· 미설명 성분 → 어디서 오는지 아직 모르는 진동 · 근거점수 → 원인 근거 점수(`+B.EVID_ADOPT+`점 이상이어야 원인으로 확정)
· 커토시스 · Crest Factor → 충격성 지표 · 1× → 축 회전 주기 · 동기/비동기 → 축 회전과 맞물린/안 맞물린 진동 · subharmonic(0.5×) → 축 회전의 절반 주기 진동
· 베인/블레이드 통과 → 날개 통과 진동 · 오일 훨 → 윤활막이 흔들리는 진동 · 2×계통주파수 → 전원에서 오는 진동
· ISO Zone → 진동 크기 구간(A 신규 설비 수준 · B 장기 운전 가능 · C 제한 운전 · D 손상 우려) · 계측 게이트 → 센서 · 배선 이상 검사
· 그 밖의 분석 용어(켑스트럼 · 커토그램 · quefrency · Nyquist 등)는 쓰지 않는다

[지켜야 할 규칙]
1) 데이터에 있는 사실만 쓴다. 값을 새로 만들거나 계산하지 않는다.
2) 엔진의 등급 · 원인 순위를 뒤집지 않는다. 근거점수는 확률이 아니다. 근거점수 0인 후보는 쓰지 않는다.
3) 숫자는 판단에 꼭 필요할 때만 — 진동 크기 · 근거점수 · 관측 창 정도. 한 줄에 숫자 하나 이하. Hz · 배수(×) 값은 [세부 조치]에 나온 것만 쓴다.
4) 계측 게이트가 걸렸으면 확정형으로 쓰지 않고 "계측 확인 전까지 잠정"으로 맺는다.
5) 결함 부위(바깥 궤도 · 안쪽 궤도 · 볼 · 케이지)는 원인 후보 이름에 있을 때만 쓴다.
6) 측정 불가 항목을 "가능성 낮음"으로 쓰지 않는다. 미검출은 "흔적 없음"까지만 쓰고 "배제"로 단정하지 않는다.
7) 관측 창을 넘는 시간을 주장하지 않는다. 창이 60분 미만이면 "말기" · "열화 진행" · "수개월 내"를 쓰지 않는다.
8) 등급을 부풀리지 않는다. ISO 값에 ⚠경계 근접이 있으면 구간을 단정하지 않는다.
9) 권장 행동은 [지금 할 일]과 [세부 조치]에 있는 것만 쓴다. 새 조치를 만들지 않는다. 위상 · 축방향 · 채널 추가 · 회전 신호(타코) 측정은 쓰지 않는다.
10) 대역 베이스라인 이탈에 ⚠상한 초과(잠정)가 있으면 결함 근거로 쓰지 않고 "설비 진동인지 센서 부착 문제인지 구분 불가"로 쓴다.

핵심 요약: <한 줄. 상태 · 이유 · 행동을 " · "로 잇는다>
## 지금 상태
• 1~2줄. 첫 줄은 판정이 이 설비에 무슨 뜻인지(당장 운전에 지장이 있는지 등).
## 그렇게 보는 이유
• 2~4줄(4줄 넘지 않음). 한 줄에 근거 하나. 판정을 받치는 근거와 확정을 막는 것을 함께 쓴다.

· 감속기(기어) 출력축의 센서면 그 축의 회전수(모터 회전수 ÷ 감속비)를 넣으십시오.
· 벨트 구동이면 모터의 정격 회전수를 넣고, 센서가 벨트 반대편(팬·펌프 등)이면 설비 설정의 센서 위치를 종동측으로 고르십시오 — 풀리비로 환산합니다.`),"베어링 모델":n("설치된 구름베어링의 품번입니다. 베어링 외륜의 각인이나 정비 이력에서 확인할 수 있습니다. 품번을 고르면 결함 주파수(BPFO/BPFI/BSF/FTF)가 자동 계산되어 베어링 결함을 판정할 수 있게 됩니다. 저널(유막) 베어링이면 sleeve를, 목록에 없는 품번이면 직접 입력을 고르세요. 비워두면 베어링 결함은 판정하지 않습니다."),"마운팅 방식":n("센서를 기계에 붙인 방법입니다. 나사로 고정했으면 스터드, 본드로 붙였으면 접착, 자석이면 자석, 손으로 대고 재면 핸드프로브를 고르세요. 방식에 따라 믿을 수 있는 주파수 상한이 달라서(스터드 10, 접착 5, 자석 2, 프로브 1 kHz) 그보다 높은 대역은 기계가 아니라 마운팅이 울린 것으로 보고 결함 탐색에서 제외합니다. 모르면 비워두세요. 대신 고주파 분석을 제한 없이 신뢰하게 되므로, 자석 마운트라면 꼭 선택하는 것이 좋습니다."),구동방식:n("모터의 힘이 기계로 전달되는 방식입니다. 축이 커플링으로 바로 이어져 있으면 직결, 벨트가 보이면 벨트, 기어박스를 거치면 기어입니다. 벨트를 고르고 풀리 지름을 넣으면 종동축 회전수가 계산되어, 정체를 알 수 없던 진동 성분이 종동축 것인지 밝힐 수 있습니다."),"날개수 · 잇수":n("펌프나 팬이면 임펠러 날개 개수, 기어 구동이면 잇수입니다. 명판이나 사양서에서 확인하세요. 날개수에 회전수를 곱한 것이 베인 통과 주파수이며, 이 성분이 크면 유동 이상이나 간극 문제를 가리킵니다. 모르면 반드시 비워두세요. 추측으로 넣으면 그 값이 그대로 판정 근거가 됩니다."),"센서 위치":n(`이 센서가 붙은 축입니다. 모터 쪽 베어링이면 모터측, 벨트 반대편(팬·펌프 등) 베어링이면 종동측을 고릅니다.

종동측이면 결함 패턴·결함 주파수·대역을 종동축 회전수로 계산합니다(모터 RPM × 구동 풀리경 ÷ 종동 풀리경). 회전수가 1~2%만 틀려도 결함 부위 판단이 흔들리므로, 타코미터 등으로 잰 종동축 회전수가 있으면 직접 입력하세요.`),"벨트 제원":n("풀리 두 개의 피치 지름(벨트가 감기는 위치의 지름 — 풀리 각인·카탈로그 값, 바깥지름보다 조금 작음)과 벨트 총길이입니다. 벨트 길이는 벨트 옆면의 각인(예: A-50, 5V1200)에서 확인합니다. 지름 두 개만 있으면 종동축 회전수가 나오고, 길이까지 있으면 벨트 자체 결함(균열·결손)의 주파수도 계산됩니다."),"대역 추출 주기":n(`이 주기마다 결함 패턴을 재서 등급을 매기므로, 등급 확정의 회차 길이도 이 주기가 정합니다. 대역 에너지와 결함 패턴은 시간·일 단위로 변하는 값이라 평상시엔 10분이면 충분합니다. 정지·신호 두절·계측 이상은 판정 주기마다 따로 봅니다.

다만 베이스라인 학습에는 표본 30개가 필요해 10분 주기면 5시간이 걸립니다. 처음 도입할 때는 과거 채우기로 지난 구간을 소급 추출하면 기다리지 않고 바로 학습할 수 있습니다.
