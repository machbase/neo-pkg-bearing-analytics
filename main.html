[답할 질문 — 이 순서로]
1) 지금 상태가 어떻게 보이나
2) 왜 그렇게 보이나 — 판정을 받치는 근거와 확정을 막는 것
3) 어떤 행동이 권장되나 — [지금 할 일]과 [세부 조치]를 쉬운 말로, 왜 하는지 붙여서

[쉬운 말로 바꾸기 — 아래 용어는 본문에 그대로 쓰지 않는다]
· BPFO → 베어링 바깥 궤도 쪽 신호 · BPFI → 안쪽 궤도 쪽 신호 · BSF → 베어링 볼 쪽 신호 · FTF → 볼을 잡아주는 케이지 쪽 신호
· 포락선 분석 → 짧은 충격이 되풀이되는지 보는 분석 · 측대역 → 신호 세기가 주기적으로 오르내리는 흔적 · 하모닉 → 같은 신호의 배수 성분
· 반복성 미확인 → 충격이 되풀이되는지 아직 확인 안 됨 · 독립 회전원 → 이 설비 축과 다른 속도로 도는 회전체(옆 기계 · 벨트로 이어진 다른 축)
· 미설명 성분 → 어디서 오는지 아직 모르는 진동 · 근거점수 → 원인 근거 점수(`+B.EVID_ADOPT+`점 이상이어야 원인으로 확정)
· 커토시스 · Crest Factor → 충격성 지표 · 1× → 축 회전 주기 · 동기/비동기 → 축 회전과 맞물린/안 맞물린 진동 · subharmonic(0.5×) → 축 회전의 절반 주기 진동
· 베인/블레이드 통과 → 날개 통과 진동 · 오일 훨 → 윤활막이 흔들리는 진동 · 2×계통주파수 → 전원에서 오는 진동
· ISO Zone → 진동 크기 구간(A 신규 설비 수준 · B 장기 운전 가능 · C 제한 운전 · D 손상 우려) · 계측 게이트 → 센서 · 배선 이상 검사
· 그 밖의 분석 용어(켑스트럼 · 커토그램 · quefrency · Nyquist 등)는 쓰지 않는다

[지켜야 할 규칙]
1) 데이터에 있는 사실만 쓴다. 값을 새로 만들거나 계산하지 않는다.
2) 엔진의 등급 · 원인 순위를 뒤집지 않는다. 근거점수는 확률이 아니다. 근거점수 0인 후보는 쓰지 않는다.
3) 숫자는 판단에 꼭 필요할 때만 — 진동 크기 · 근거점수 · 관측 창 정도. 한 줄에 숫자 하나 이하. Hz · 배수(×) 값은 [세부 조치]에 나온 것만 쓴다.
4) 계측 게이트가 걸렸으면 확정형으로 쓰지 않고 "계측 확인 전까지 잠정"으로 맺는다.
5) 결함 부위(바깥 궤도 · 안쪽 궤도 · 볼 · 케이지)는 원인 후보 이름에 있을 때만 쓴다.
6) 측정 불가 항목을 "가능성 낮음"으로 쓰지 않는다. 미검출은 "흔적 없음"까지만 쓰고 "배제"로 단정하지 않는다.
7) 관측 창을 넘는 시간을 주장하지 않는다. 창이 60분 미만이면 "말기" · "열화 진행" · "수개월 내"를 쓰지 않는다.
8) 등급을 부풀리지 않는다. ISO 값에 ⚠경계 근접이 있으면 구간을 단정하지 않는다.
9) 권장 행동은 [지금 할 일]과 [세부 조치]에 있는 것만 쓴다. 새 조치를 만들지 않는다. 위상 · 축방향 · 채널 추가 · 회전 신호(타코) 측정은 쓰지 않는다.
10) 대역 베이스라인 이탈에 ⚠상한 초과(잠정)가 있으면 결함 근거로 쓰지 않고 "설비 진동인지 센서 부착 문제인지 구분 불가"로 쓴다.

[출력 형식 — 아래 네 부분만]
핵심 요약: <한 줄. 상태 · 이유 · 행동을 " · "로 잇는다>
## 지금 상태
• 1~2줄. 첫 줄은 판정이 이 설비에 무슨 뜻인지(당장 운전에 지장이 있는지 등).
## 그렇게 보는 이유
• 2~4줄(4줄 넘지 않음). 한 줄에 근거 하나. 판정을 받치는 근거와 확정을 막는 것을 함께 쓴다.
## 권장 행동
• 2~3줄. 첫 줄은 [지금 할 일], 다음 줄은 [세부 조치] 중 중요한 것. 한 줄 = "<할 일> — <왜 하는지>". 줄 앞에 "지금 할 일:" 같은 꼬리표를 붙이지 않는다.

· 벨트 구동이면 모터의 정격 회전수를 넣고, 센서가 벨트 반대편(팬·펌프 등)이면 설비 설정의 센서 위치를 종동측으로 고르십시오 — 풀리비로 환산합니다.`,"베어링 모델":"설치된 구름베어링의 품번입니다. 베어링 외륜의 각인이나 정비 이력에서 확인할 수 있습니다. 품번을 고르면 결함 주파수(BPFO/BPFI/BSF/FTF)가 자동 계산되어 베어링 결함을 판정할 수 있게 됩니다. 저널(유막) 베어링이면 sleeve를, 목록에 없는 품번이면 직접 입력을 고르세요. 비워두면 베어링 결함은 판정하지 않습니다.","마운팅 방식":"센서를 기계에 붙인 방법입니다. 나사로 고정했으면 스터드, 본드로 붙였으면 접착, 자석이면 자석, 손으로 대고 재면 핸드프로브를 고르세요. 방식에 따라 믿을 수 있는 주파수 상한이 달라서(스터드 10, 접착 5, 자석 2, 프로브 1 kHz) 그보다 높은 대역은 기계가 아니라 마운팅이 울린 것으로 보고 결함 탐색에서 제외합니다. 모르면 비워두세요. 대신 고주파 분석을 제한 없이 신뢰하게 되므로, 자석 마운트라면 꼭 선택하는 것이 좋습니다.",구동방식:"모터의 힘이 기계로 전달되는 방식입니다. 축이 커플링으로 바로 이어져 있으면 직결, 벨트가 보이면 벨트, 기어박스를 거치면 기어입니다. 벨트를 고르고 풀리 지름을 넣으면 종동축 회전수가 계산되어, 정체를 알 수 없던 진동 성분이 종동축 것인지 밝힐 수 있습니다.","날개수 · 잇수":"펌프나 팬이면 임펠러 날개 개수, 기어 구동이면 잇수입니다. 명판이나 사양서에서 확인하세요. 날개수에 회전수를 곱한 것이 베인 통과 주파수이며, 이 성분이 크면 유동 이상이나 간극 문제를 가리킵니다. 모르면 반드시 비워두세요. 추측으로 넣으면 그 값이 그대로 판정 근거가 됩니다.","센서 위치":`이 센서가 붙은 축입니다. 모터 쪽 베어링이면 모터측, 벨트 반대편(팬·펌프 등) 베어링이면 종동측을 고릅니다.

종동측이면 결함 패턴·결함 주파수·대역을 종동축 회전수로 계산합니다(모터 RPM × 구동 풀리경 ÷ 종동 풀리경). 회전수가 1~2%만 틀려도 결함 부위 판단이 흔들리므로, 타코미터 등으로 잰 종동축 회전수가 있으면 직접 입력하세요.`,"벨트 제원":"풀리 두 개의 피치 지름(벨트가 감기는 위치의 지름 — 풀리 각인·카탈로그 값, 바깥지름보다 조금 작음)과 벨트 총길이입니다. 벨트 길이는 벨트 옆면의 각인(예: A-50, 5V1200)에서 확인합니다. 지름 두 개만 있으면 종동축 회전수가 나오고, 길이까지 있으면 벨트 자체 결함(균열·결손)의 주파수도 계산됩니다.","대역 추출 주기":`이 주기마다 결함 패턴을 재서 등급을 매기므로, 등급 확정의 회차 길이도 이 주기가 정합니다. 대역 에너지와 결함 패턴은 시간·일 단위로 변하는 값이라 평상시엔 10분이면 충분합니다. 정지·신호 두절·계측 이상은 판정 주기마다 따로 봅니다.

다만 베이스라인 학습에는 표본 30개가 필요해 10분 주기면 5시간이 걸립니다. 처음 도입할 때는 과거 채우기로 지난 구간을 소급 추출하면 기다리지 않고 바로 학습할 수 있습니다.

40대 기준 서버 부하 — 10분 5.5% · 30분 1.8% · 1시간 0.9%`,"전원 계통주파수":"모터에 공급되는 상용전원의 주파수로, 한국은 60 Hz입니다. 전기적 결함은 이 값의 2배(120 Hz)에서 나타나며, 기계적 결함과 달리 회전수가 변해도 움직이지 않는 것이 구분 기준입니다. 입력된 RPM이 다른 계통의 동기속도에 맞으면 경고를 표시합니다.",품번:"베어링의 제조사·품번입니다(예: SKF 22218 E). 판정에는 쓰지 않고, 상세분석·리포트에 어떤 베어링인지 표시합니다. 형상값은 이 품번의 제조사 카탈로그에서 옮겨 적습니다.","볼 수 n":"전동체(볼 또는 롤러)의 개수입니다. 베어링 제조사 카탈로그의 형상 제원에서 확인합니다. 네 값이 모두 있어야 결함 주파수가 계산됩니다.","볼경 Bd":"전동체 하나의 지름(mm)입니다. 카탈로그의 ball diameter 항목입니다.","피치경 Pd":"전동체들의 중심을 잇는 원의 지름(mm)입니다. 카탈로그의 pitch diameter 항목이며, 대략 (내경+외경)÷2입니다.","접촉각 φ":"전동체가 궤도면과 닿는 각도입니다. 깊은홈 볼베어링은 0°, 앵귤러 콘택트는 15~40°입니다. 모르면 0으로 두세요.","A/B":"ISO 존 A와 B를 가르는 경계입니다. A는 신품 수준의 진동, B는 제한 없이 장기 운전할 수 있는 수준입니다. 측정값이 이 값을 넘으면 ISO 존이 B로 표시됩니다. 등급은 결함 패턴이 잡혀야 켜지고 켜지면 최소 주의라, 이 경계는 등급을 바꾸지 않습니다.","B/C":"ISO 존 B와 C를 가르는 경계입니다. C부터는 장기 운전에 부적합한 수준이라 조치 권고가 여기서 갈립니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 위험으로 올라갑니다. 세 경계 중 실무에서 가장 중요한 값입니다.","C/D":"ISO 존 C와 D를 가르는 경계입니다. D는 기계에 손상을 일으킬 수 있는 수준으로, 긴급 점검 대상입니다. 결함 패턴이 잡힌 설비가 이 값을 넘으면 등급이 심각으로 올라갑니다.","임계 초기화":"수정한 임계값을 ISO 10816 기본값으로 되돌립니다. 값을 직접 수정하면 그때부터는 규격이 아니라 사용자 정의 기준으로 판정한다는 점을 유의하세요.","정상 학습 기간":'이 구간의 데이터를 "정상 상태"로 간주해 중심(μ)과 평소 변동(σ)을 학습합니다. 정지·기동 구간과 순간 스파이크는 자동으로 걸러지지만, 결함이 이미 진행 중인 기간으로 학습하면 그 결함이 정상 기준이 됩니다 — 정상 운전이 확실한 기간을 고르세요. 길수록 다양한 운전 상태가 포함돼 기준이 견고해집니다.',"k (σ 배수)":"평소 변동(σ)의 몇 배까지를 정상으로 볼지 정하는 값입니다. k=3이면 정상 데이터의 약 99.7%가 한계 안에 들어옵니다. 낮추면 민감해져 급증을 일찍 잡는 대신 오탐이 늘고, 높이면 그 반대입니다. 확신이 없으면 3을 그대로 두세요.","판정 주기":`얼마나 자주 판정하는지입니다.
