아래 측정 데이터와 엔진 판정 결과만 근거로 한국어 소견을 작성하세요.
검산·결함주파수 매칭·계측 게이트 판정은 엔진이 이미 끝냈습니다. 당신은 그 결과를 규율 있게 서술합니다.

[지켜야 할 규칙]
1) 주어진 값만 인용한다. 결함주파수·회전수·대역값을 새로 만들지 않는다. 계산하지 말고 엔진이 준 숫자를 그대로 쓴다.
2) 엔진의 근거점수와 순위를 재해석하거나 뒤집지 않는다. 그대로 인용한다(근거점수는 0~100 Evidence Score이며 확률이 아니다).
3) gate.tripped=true면 확정형 결론을 쓰지 않는다. "~일 가능성이 가장 높습니다" 금지. "계측 검증 전까지 잠정"으로 맺는다.
4) ISO 판정 등급(iso)과 실시간 감시 등급(monitor)을 반드시 구분해서 쓴다. 두 값을 한 문장에 섞지 않는다. 두 등급이 다르면 "규격 판정 X / 감시 등급 Y — 광대역 고주파 성분 차이"로 한 줄 설명한다.
5) negative[] 목록을 반드시 한 줄 이상 인쇄한다. "찾았으나 없었다"는 보고할 결과다. 생략하지 않는다.
6) unmeasurable[] 항목은 "측정 불가"로만 쓴다. 점수·별점·"근거 부족"·"가능성 낮음" 같은 표현을 쓰지 않는다. 원리상 판별할 수 없는 것이다.
7) unexplained[] 성분을 목록에서 빼지 않는다. "미설명"으로 남기고, 무엇이 있으면 닫히는지(구동 계통도 등)를 적는다.
8) window.minutes를 넘는 시간 스케일을 주장하지 않는다. 창이 60분 미만이면 "말기", "열화 진행", "수개월 내" 같은 표현을 쓰지 않고 "관측 창이 짧아 추세 판단 불가"로 쓴다.
9) 등급을 부풀리지 않는다. 평균이 양호한데 순간값으로 "위험"이라 쓰지 않는다. 조치는 등급에 맞춘다 — "즉시 정지"로 단정하지 말고(정지는 설비 중요도·추가 증상 고려), 위험 등급은 "조기·우선순위 높은 점검", 심각 등급은 "긴급 점검 · 중요도에 따라 정지 여부 검토"로 쓴다.
10) missing_metadata[]가 있으면 [권장 조치]에 "이 항목을 채우면 무엇이 닫히는지"를 한 줄로 적는다.
11) "대역 베이스라인 이탈"에 ⚠상한 초과(잠정) 표시가 있으면, 그 대역의 상승을 결함 근거로 단정하지 않는다. 상승 사실은 반드시 인쇄하되(빼면 센서 부착 불량도 초기 결함도 보고되지 않는다) "설비 진동인지 센서 부착부 공진인지 구분 불가"로 쓰고, [권장 조치] 첫 줄을 "센서 부착 상태 확인"으로 둔다.

), III·IV는 대형(각각 강성·연성 기초)입니다. 같은 진동값이라도 등급에 따라 양호/위험 판정이 달라집니다. 비워두면 Class II 기준(1.12 / 2.80 / 7.10 mm/s)으로 판정합니다.",RPM:"명판에 적힌 회전수입니다. 정확할 필요는 없습니다 — 스펙트럼에서 이 값의 ±12% 안을 뒤져 회전 피크를 찾고, 또렷하게 잡히면 실측값을 씁니다(슬립·부하로 인한 2~5% 차이는 자동 보정). 대신 자릿수는 맞아야 합니다: 3600 rpm 설비에 1800을 넣으면 찾는 범위 자체가 빗나가 실측이 안 되고, 모든 주파수 해석과 대역 경계가 절반으로 어긋납니다. 비워두면 1800 rpm으로 가정합니다.","베어링 모델":"설치된 구름베어링의 품번입니다. 베어링 외륜의 각인이나 정비 이력에서 확인할 수 있습니다. 품번을 고르면 결함 주파수(BPFO/BPFI/BSF/FTF)가 자동 계산되어 베어링 결함을 판정할 수 있게 됩니다. 저널(유막) 베어링이면 sleeve를, 목록에 없는 품번이면 직접 입력을 고르세요. 비워두면 베어링 결함은 판정하지 않습니다.","마운팅 방식":"센서를 기계에 붙인 방법입니다. 나사로 고정했으면 스터드, 본드로 붙였으면 접착, 자석이면 자석, 손으로 대고 재면 핸드프로브를 고르세요. 방식에 따라 믿을 수 있는 주파수 상한이 달라서(스터드 10, 접착 5, 자석 2, 프로브 1 kHz) 그보다 높은 대역은 기계가 아니라 마운팅이 울린 것으로 보고 결함 탐색에서 제외합니다. 모르면 비워두세요. 대신 고주파 분석을 제한 없이 신뢰하게 되므로, 자석 마운트라면 꼭 선택하는 것이 좋습니다.",구동방식:"모터의 힘이 기계로 전달되는 방식입니다. 축이 커플링으로 바로 이어져 있으면 직결, 벨트가 보이면 벨트, 기어박스를 거치면 기어입니다. 벨트를 고르고 풀리 지름을 넣으면 종동축 회전수가 계산되어, 정체를 알 수 없던 진동 성분이 종동축 것인지 밝힐 수 있습니다.","날개수 · 잇수":"펌프나 팬이면 임펠러 날개 개수, 기어 구동이면 잇수입니다. 명판이나 사양서에서 확인하세요. 날개수에 회전수를 곱한 것이 베인 통과 주파수이며, 이 성분이 크면 유동 이상이나 간극 문제를 가리킵니다. 모르면 반드시 비워두세요. 추측으로 넣으면 그 값이 그대로 판정 근거가 됩니다.","벨트 제원":"풀리 두 개의 바깥지름과 벨트 총길이입니다. 풀리 지름은 자로 재면 되고, 벨트 길이는 벨트 옆면의 각인(예: A-50, 5V1200)에서 확인합니다. 지름 두 개만 있으면 종동축 회전수가 나오고, 길이까지 있으면 벨트 자체 결함(균열·결손)의 주파수도 계산됩니다.","대역 추출 주기":`대역 에너지는 시간·일 단위로 변하는 값이라 평상시엔 10분이면 충분합니다. 급변하는 사고는 전체 RMS 알람이 10초 주기로 따로 잡습니다.

다만 베이스라인 학습에는 표본 30개가 필요해 10분 주기면 5시간이 걸립니다. 처음 도입할 때는 과거 채우기로 지난 구간을 소급 추출하면 기다리지 않고 바로 학습할 수 있습니다.

40대 기준 서버 부하 — 10분 5.5% · 30분 1.8% · 1시간 0.9%`,"전원 계통주파수":"모터에 공급되는 상용전원의 주파수로, 한국은 60 Hz입니다. 전기적 결함은 이 값의 2배(120 Hz)에서 나타나며, 기계적 결함과 달리 회전수가 변해도 움직이지 않는 것이 구분 기준입니다. 입력된 RPM이 다른 계통의 동기속도에 맞으면 경고를 표시합니다.","볼 수 n":"전동체(볼 또는 롤러)의 개수입니다. 베어링 제조사 카탈로그의 형상 제원에서 확인합니다. 네 값이 모두 있어야 결함 주파수가 계산됩니다.","볼경 Bd":"전동체 하나의 지름(mm)입니다. 카탈로그의 ball diameter 항목입니다.","피치경 Pd":"전동체들의 중심을 잇는 원의 지름(mm)입니다. 카탈로그의 pitch diameter 항목이며, 대략 (내경+외경)÷2입니다.","접촉각 φ":"전동체가 궤도면과 닿는 각도입니다. 깊은홈 볼베어링은 0°, 앵귤러 콘택트는 15~40°입니다. 모르면 0으로 두세요.","A/B":"A(양호)와 B(주의)를 가르는 경계입니다. A는 신품 수준의 진동, B는 제한 없이 장기 운전할 수 있는 수준입니다. 측정값이 이 값을 넘으면 상태가 주의로 표시됩니다.","B/C":"B(주의)와 C(위험)를 가르는 경계입니다. C부터는 장기 운전에 부적합한 수준이라 알람과 조치 권고가 여기서 갈립니다. 세 경계 중 실무에서 가장 중요한 값입니다.","C/D":"C(위험)와 D(심각)를 가르는 경계입니다. D는 기계에 손상을 일으킬 수 있는 수준으로, 긴급 점검 대상입니다.","임계 초기화":"수정한 임계값을 ISO 10816 기본값으로 되돌립니다. 값을 직접 수정하면 그때부터는 규격이 아니라 사용자 정의 기준으로 판정한다는 점을 유의하세요.","정상 학습 기간":'이 구간의 데이터를 "정상 상태"로 간주해 중심(μ)과 평소 변동(σ)을 학습합니다. 정지·기동 구간과 순간 스파이크는 자동으로 걸러지지만, 결함이 이미 진행 중인 기간으로 학습하면 그 결함이 정상 기준이 됩니다 — 정상 운전이 확실한 기간을 고르세요. 길수록 다양한 운전 상태가 포함돼 기준이 견고해집니다.',"k (σ 배수)":"평소 변동(σ)의 몇 배까지를 정상으로 볼지 정하는 값입니다. k=3이면 정상 데이터의 약 99.7%가 한계 안에 들어옵니다. 낮추면 민감해져 급증을 일찍 잡는 대신 오탐이 늘고, 높이면 그 반대입니다. 확신이 없으면 3을 그대로 두세요.","판정 주기":`얼마나 자주 판정하는지입니다.
