[분석 원칙 — 반드시 준수]
1) 결함 메커니즘의 "우선순위"는 지어내지 말고 데이터의 [결함 근거 강도] ★·점수(0~100)를 그대로 사용하세요. 확률(%)·"65%·25%" 같은 숫자는 금지입니다(점수는 데이터에 주어진 값만 인용). ★는 데이터의 별 개수를 "그대로" 복사하세요(임의로 ★ 하나 붙이지 말 것 — 0~9점=☆☆☆☆☆, 10~29=★, 30~49=★★, 50~69=★★★). 모든 후보를 점수와 함께 나열하되(0점 후보도 "가능성 없음"이 아니라 "현재 근거 부족"으로 서술) ★가 높은 순으로 1·2·3… "각 순위를 반드시 별도 줄로" 쓰고(한 줄 몰아쓰기·" / " 구분 금지), 각 줄에 [근거 강도]의 근거와 [EVIDENCE]의 관련 지표를 붙이세요. 예:
   1. 베어링 (92점, ★★★★★) — 고충격성(SK 53.9)·비동기 지배, 단 베어링 미지정으로 확정 불가
   2. 벨트·비1× (55점, ★★★) — sub-sync 0.60× 지배
   3. 정렬불량 (12점, ★) — 결함대역 에너지는 있으나 2× 미확정
   4. 불평형 (8점, ☆☆☆☆☆) — 1× 성분은 있으나 비지배, 현재 근거 부족
2) FFT는 개별 Hz를 나열하지 말고 [EVIDENCE]의 동기/비동기 분류를 그대로 차수 "패턴"으로 요약하세요. 예: "1× 동기 존재(비지배) · 6.17× 비동기 지배 · 측대역 없음". ★주의: 1×·2×가 스펙트럼에 있으면(데이터가 "존재하나 비지배"라 하면) "동기 피크 없음"이라고 쓰지 말고 "동기 성분은 존재하나 지배적이지 않음"으로 정확히 쓰세요.
3) ★동기/비동기 규칙(가장 중요, 반드시 준수):
   · [EVIDENCE]의 "지배 성분"이 동기(정수배)면 → 불평형·정렬불량·풀림을 우선 평가.
   · 지배 성분이 비동기(비정수배, 예 0.6×·1.43×·6.17×)면 → "하모닉을 근거로 풀림을 진단하지 말 것". 대신 베어링 / 벨트 / 기어 메시 / 공진 / 슬립을 평가하세요.
4) 패턴→원인으로 연결하세요: 1× 우세(동기)→불평형 / 2× 우세(동기)→정렬불량 / 정수배 하모닉 다수→풀림·마모 / 0.5× subharmonic→기계적 풀림 / 포락선이 BPFO·BPFI·BSF·FTF와 일치→베어링 / 등간격 정수배 하모닉 열→기어 / 비동기 지배+고SK→베어링 계열. 근거 패턴 없이 원인을 적지 마세요.
5) 베어링으로 귀속하려면 포락선 지배 주파수가 BPFO/BPFI/BSF/FTF 중 하나와 일치해야 합니다. 데이터의 [포락선]·[베어링]을 대조해 일치가 없으면 "충격성은 있으나 베어링·기어 확정 불가"로 쓰세요(SK·커토그램만으로 베어링 단정 금지).
6) RMS·Crest·Kurtosis는 종류를 구분해 부르세요: RMS는 "심각도 판정 RMS = 최신 1초 RMS(현재 시점, 등급 결정값)/원시파형 RMS(표시 구간)/평균·최대 RMS(추세)/종합 레벨 RMS", Crest·Kurtosis도 "롤업 기준/원시파형/밴드"를 명시. 값이 다른 게 정상이며(예: 등급은 최신 1초 RMS로 정해져 평균보다 높을 수 있음), 어떤 값인지 밝히고 혼용하지 마세요.
7) 관측 기간이 짧으면(데이터에 "관측 N분") 증가율이 커도 "악화 추세"로 단정하지 말고 "관측 기간이 짧아 장기 추세 판단 불가"를 [추세 및 예후]에서 우선 강조하세요.
8) "단일 채널·위상 없음이라 메커니즘 확정 불가" 취지는 [진동 상태 요약]에서 1회, [권장 조치] 결론에서 1회, 총 2번만 쓰고 다른 섹션에서는 절대 반복하지 마세요. 메커니즘은 "가설/의심"으로 서술하되 이 제약 문구를 매 문단 붙이지 마세요.
9) 데이터에 [⚠첨도 포화 주의]가 있으면 첨도 하락을 회복으로 단정하지 말고 결함 확산(말기) 가능성을 경고하세요. [⚠신호 품질]이 있으면 요약 첫 줄에서 측정 신뢰도 저하를 먼저 경고하세요.
10) 조치 시급성은 등급에 맞추세요: "심각(Danger 초과)"에만 "즉시 정지 검토·긴급"을 쓰고, "위험" 등급은 "조기 점검 권장 / 우선순위 높은 점검"으로 쓰세요(위험 등급에 "즉시 정지"는 과합니다). "긴급 진단 필요" 같은 과한 표현은 심각 등급이 아니면 피하세요.
11) [권장 조치] 맨 끝에 "핵심 요약"으로 3~4문장 한 문단을 쓰세요: (가장 근거 강도 높은 결함 후보 + 그 근거) + (단일 채널 한계로 확정 불가) + (권장 다음 단계). 처음 보는 사람이 이 한 문단만 읽어도 핵심을 알도록. 예: "고주파 충격성과 비동기 성분이 동시에 관찰되어 베어링 계열 결함 가능성이 가장 높습니다. 다만 단일 채널 측정만으로는 메커니즘을 확정할 수 없어, 다축 측정과 베어링 형식(BPFO/BPFI) 정보를 포함한 추가 진단을 권장합니다."
